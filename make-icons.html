<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صانع أيقونات أذكاري</title>
<style>
body{font-family:system-ui,sans-serif;background:#F6F3EC;color:#2A2A27;max-width:560px;margin:0 auto;padding:28px 18px;text-align:center;line-height:1.8}
.pv{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}
.pv div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.pv img{width:96px;height:96px;border-radius:22%}
button{background:#0F6E56;color:#fff;border:none;border-radius:12px;min-height:50px;padding:0 22px;font-size:16px;cursor:pointer;margin:6px}
.sm{background:#fff;color:#0F6E56;border:1px solid #E3DDCF;min-height:40px;font-size:14px}
</style>
</head>
<body>
<h2>أيقونات تطبيق أذكاري</h2>
<p>اضغط الزر لتنزيل الأيقونات الأربع، ثم انقلها إلى مجلد التطبيق بجوار <b>index.html</b>.<br>إذا سأل المتصفح عن السماح بتنزيل عدة ملفات فاختر «السماح».</p>
<div class="pv" id="pv"></div>
<button id="all">⬇️ تنزيل كل الأيقونات</button>
<div id="one"></div>
<script>
var STAR='338,264 346.8,287.9 372.2,288.9 352.3,304.6 359.2,329.1 338,315 316.8,329.1 323.7,304.6 303.8,288.9 329.2,287.9';
function svg(rx){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="'+rx+'" fill="#0F6E56"/><circle cx="246" cy="262" r="150" fill="#FAEEDA"/><circle cx="306" cy="222" r="128" fill="#0F6E56"/><polygon fill="#FAC775" points="'+STAR+'"/></svg>'}
var FILES=[{n:'icon-192.png',s:192},{n:'icon-512.png',s:512},{n:'apple-touch-icon.png',s:180},{n:'icon.svg',s:0}];
function png(size){return new Promise(function(res){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,0,0,size,size);res(c.toDataURL('image/png'))};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(0))})}
function url(f){return f.s?png(f.s):Promise.resolve('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(112)))}
function dl(f){return url(f).then(function(u){var a=document.createElement('a');a.href=u;a.download=f.n;document.body.appendChild(a);a.click();a.remove()})}
FILES.forEach(function(f){url(f).then(function(u){var d=document.createElement('div');d.innerHTML='<img src="'+u+'" alt=""><span>'+f.n+'</span>';document.getElementById('pv').appendChild(d)});
 var b=document.createElement('button');b.className='sm';b.textContent='تنزيل '+f.n;b.onclick=function(){dl(f)};document.getElementById('one').appendChild(b)});
document.getElementById('all').onclick=function(){FILES.reduce(function(p,f){return p.then(function(){return dl(f)}).then(function(){return new Promise(function(r){setTimeout(r,400)})})},Promise.resolve())};
</script>
</body>
</html>
