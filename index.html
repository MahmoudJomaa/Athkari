<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="description" content="أذكار الصباح والمساء مع الشرح والفضل، ومسبحة، وأفكار عمل يومية">
<title>أذكاري</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC;--card:#FFFFFF;--soft:#EFEBE1;--line:#E3DDCF;
  --tx:#2A2A27;--tx2:#5F5E5A;--tx3:#8B897F;
  --ac:#0F6E56;--acbg:#E1F5EE;--gd:#854F0B;--gdbg:#FAEEDA;
  --ok:#3B6D11;--okbg:#EAF3DE;--okline:#C0DD97;--zk:22px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181A;--card:#1F2225;--soft:#262A2D;--line:#33383C;
    --tx:#EDEBE5;--tx2:#B4B2A9;--tx3:#888780;
    --ac:#5DCAA5;--acbg:#0F2E27;--gd:#FAC775;--gdbg:#3A2A10;
    --ok:#97C459;--okbg:#1E2A12;--okline:#3B6D11;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{padding:0 0 calc(84px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
.appbar{position:sticky;top:0;z-index:9;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.appbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;border-radius:11px;flex-shrink:0}
.appbar h1{font-family:'Amiri',serif;font-size:24px;margin:0;color:var(--ac);font-weight:700;line-height:1.1}
.appbar small{color:var(--tx3);font-size:12px}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:19px;padding:0;display:flex;align-items:center;justify-content:center}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 16px}
.streak{background:var(--gdbg);color:var(--gd);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
button,select,input{font-family:inherit;color:var(--tx);cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:46px;font-size:15px;padding:0 12px}
.btn:active,.ring:active,.tb:active,.icb:active{transform:scale(.96)}
.btn.pri{background:var(--ac);color:var(--card);border-color:var(--ac);font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;min-height:44px;font-size:15px;color:var(--tx2);transition:background .2s}
.seg button.on{background:var(--card);color:var(--ac);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;transition:background .3s,border-color .3s;position:relative;overflow:hidden}
.card.done{background:var(--okbg);border-color:var(--okline)}
.zk{font-family:'Amiri',serif;font-size:var(--zk);line-height:2.05;margin:6px 0 14px;text-align:center;cursor:pointer}
.pill{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--gdbg);color:var(--gd)}
.box{border-radius:14px;padding:14px;font-size:16px;line-height:1.9;margin-top:10px}
.lbl{font-size:13px;color:var(--tx2);margin:0 0 6px;font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.bar{height:7px;background:var(--soft);border-radius:7px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--ac);border-radius:7px;transition:width .4s}
.msg{background:var(--okbg);color:var(--ok);text-align:center;border-radius:14px;padding:12px;margin-bottom:14px;font-weight:500}
.ring{width:110px;height:110px;border-radius:50%;border:none;background:transparent;padding:0;position:relative;display:block;margin:0 auto;transition:transform .1s}
.ring svg,.tb svg{position:absolute;inset:0}
.ring .n{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ac)}
.card.done .ring .n{color:var(--ok)}
.hint{font-size:12.5px;color:var(--tx3);text-align:center;margin:12px 0 0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-bottom:14px}
.chips button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chips button.d{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.chips button.cur{border:2px solid var(--ac);color:var(--ac);font-weight:700}
.srow{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--line);gap:10px}
.tg{width:52px;height:30px;border-radius:30px;border:none;background:var(--line);position:relative;padding:0;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.tg.on{background:var(--ac)}.tg.on::after{right:25px}
input[type=range]{width:150px;accent-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;gap:6px;max-width:640px;width:100%}
nav button{flex:1;border:none;background:transparent;border-radius:12px;min-height:54px;font-size:14px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{background:var(--acbg);color:var(--ac);font-weight:700}
select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;padding:0 12px;margin-bottom:12px}
.tb{width:260px;height:260px;border-radius:50%;border:none;padding:0;position:relative;background:transparent;margin:0 auto;display:block;transition:transform .08s}
.tb .num{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ac)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:19px}
.page{display:none}.page.on{display:block;animation:fade .25s ease}
.inst{display:flex;align-items:center;gap:10px;background:var(--acbg);color:var(--ac);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.7}
.inst .x{background:none;border:none;color:var(--ac);font-size:20px;min-width:36px;min-height:36px;padding:0}
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
#splash{position:fixed;inset:0;z-index:50;background:#0F6E56;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FAEEDA;transition:opacity .45s}
#splash svg{width:110px;height:110px;animation:pop .8s ease}
#splash p{font-family:'Amiri',serif;font-size:34px;margin:10px 0 0}
#splash.hide{opacity:0;pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes inN{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--acbg)}100%{box-shadow:0 0 0 26px transparent}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(540deg);opacity:0}}
.aN{animation:inN .32s ease}.aP{animation:inP .32s ease}.aU{animation:up .35s ease}
.pop{animation:pop .25s ease}
.tb.pl{animation:pulse .45s ease-out}
.cf{position:absolute;top:0;width:8px;height:12px;border-radius:2px;animation:fall 2.2s ease-in forwards}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;padding:10px 12px;margin-bottom:10px;-webkit-user-select:text;user-select:text;cursor:text;font-family:inherit;resize:vertical}
.inp:focus{outline:2px solid var(--ac);outline-offset:-1px}
.btn.dash{border-style:dashed;color:var(--ac);width:100%;font-weight:500}
.lnk{background:none;border:none;color:var(--tx3);font-size:13px;min-height:36px;padding:0 6px}
@media (min-width:700px){:root{--zk:24px}}
</style>
</head>
<body>
<div id="splash">
  <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0F6E56"/><circle cx="246" cy="262" r="150" fill="#FAEEDA"/><circle cx="306" cy="222" r="128" fill="#0F6E56"/><polygon fill="#FAC775" points="338,264 346.8,287.9 372.2,288.9 352.3,304.6 359.2,329.1 338,315 316.8,329.1 323.7,304.6 303.8,288.9 329.2,287.9"/></svg>
  <p>أذكاري</p>
</div>

<header class="appbar"><div class="in">
  <div class="brand">
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0F6E56"/><circle cx="246" cy="262" r="150" fill="#FAEEDA"/><circle cx="306" cy="222" r="128" fill="#0F6E56"/><polygon fill="#FAC775" points="338,264 346.8,287.9 372.2,288.9 352.3,304.6 359.2,329.1 338,315 316.8,329.1 323.7,304.6 303.8,288.9 329.2,287.9"/></svg>
    <div><h1>أذكاري</h1><small id="today"></small></div>
  </div>
  <div class="row" style="gap:8px"><span class="streak" id="stk"></span><button class="icb" id="setb" aria-label="الإعدادات">⚙️</button></div>
</div></header>

<div class="wrap">
  <div id="inst"></div>
  <section class="page on" id="pz"></section>
  <section class="page" id="pt"></section>
  <section class="page" id="pg"></section>
</div>

<nav><div class="in" id="nav">
  <button class="on" data-p="z"><span>📖</span>الأذكار</button>
  <button data-p="t"><span>📿</span>المسبحة</button>
  <button data-p="g"><span>🤍</span>عمل اليوم</button>
</div></nav>

<div class="sbg" id="sbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="الإعدادات"></div>

<script>
var D=[
{t:'b',n:1,m:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ: ﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾',
eg:'دي آية الكرسي، أعظم آية في القرآن. بتعرّفك إن ربنا حيّ ومش بينام ولا بيتعب، وكل حاجة في السما والأرض ملكه وتحت علمه، فتطمّن إن اللي ماسك الكون كله هو اللي بيحرسك.',
fs:'آية الكرسي أعظم آية في كتاب الله، تُثبت لله كمال الحياة والقيومية، وتنفي عنه النوم والغفلة، وتبيّن سعة ملكه وعلمه، فيستقرّ في قلب قارئها أنه في حفظ من لا يعجزه شيء.',
f:'من قالها حين يُصبح أُجير من الجن حتى يُمسي، ومن قالها حين يُمسي أُجير منهم حتى يُصبح.',s:'رواه النسائي في الكبرى والحاكم، وصحّحه الألباني.'},
{t:'b',n:3,m:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾',
eg:'سورة الإخلاص بتلخّص التوحيد كله: ربنا واحد، والكل محتاجله وهو مش محتاج لحد، ومالوش شبيه ولا ولد ولا والد.',
fs:'سورة الإخلاص خالصة في توحيد الله: فهو الأحد الذي لا شريك له، والصمد الذي تقصده الخلائق في حوائجها، المنزّه عن الولد والوالد والنظير.',
f:'قال النبي ﷺ عن الإخلاص والمعوذتين: تقولها حين تُمسي وحين تُصبح ثلاث مرات تكفيك من كل شيء.',s:'رواه أبو داود والترمذي، وقال الترمذي: حسن صحيح.'},
{t:'b',n:3,m:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ: ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾',
eg:'بتستخبى في ربنا من كل شر: شر الليل لما يضلّم وتطلع فيه الأذيّة، وشر السحر، وشر العين والحسد.',
fs:'استعاذةٌ برب الصبح من شر المخلوقات عامة، ومن شر الليل إذا أظلم، ومن شر السواحر، ومن شر الحاسد إذا أظهر حسده.',
f:'مع الإخلاص والناس ثلاثًا صباحًا ومساءً تكفيك من كل شيء.',s:'رواه أبو داود والترمذي، وقال الترمذي: حسن صحيح.'},
{t:'b',n:3,m:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ: ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ﴾',
eg:'بتحتمي بربنا من الوسوسة اللي بتيجي جوه القلب، سواء من شيطان أو من بني آدم بيزقّك للغلط.',
fs:'استعاذةٌ بالله بربوبيته وملكه وألوهيته من شر الموسوس الذي يختفي عند ذكر الله، سواء كان من الجن أو من الإنس.',
f:'مع الإخلاص والفلق ثلاثًا صباحًا ومساءً تكفيك من كل شيء.',s:'رواه أبو داود والترمذي، وقال الترمذي: حسن صحيح.'},
{t:'e',n:1,m:'﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾',
eg:'آخر آيتين في البقرة: إعلان إيمان وسمع وطاعة، وطمأنة إن ربنا مش هيحمّلك فوق طاقتك، ودعاء بالعفو والمغفرة والرحمة والنصر.',
fs:'خاتمة سورة البقرة إقرارٌ بأركان الإيمان والسمع والطاعة، وبيانٌ لرحمة الله في التكليف بقدر الوسع، مع دعاءٍ جامع بالعفو والمغفرة والرحمة والنصر.',
f:'من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه.',s:'متفق عليه: رواه البخاري ومسلم.'},
{t:'b',n:1,m:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ',
e:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ',
eg:'بتبدأ يومك أو ليلتك وانت معترف إن الملك كله لربنا، وبتطلب منه خير اللي جاي وتستعيذ بيه من شرّه، ومن الكسل، ومن تعب الكِبَر، ومن عذاب النار والقبر.',
fs:'إقرارٌ بأن الملك كله لله في هذا الوقت، ثم سؤالٌ لخير اليوم أو الليلة وما بعدهما، واستعاذةٌ من شرّهما ومن الكسل وسوء الكبر وعذاب النار والقبر.',
f:'كان النبي ﷺ يقوله إذا أصبح وإذا أمسى، فهو من هديه الثابت.',s:'رواه مسلم.'},
{t:'b',n:1,m:'اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ',e:'اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ',
eg:'يعني يا رب انت اللي صحّيتنا وانت اللي بتمسّينا، حياتنا وموتنا بإيدك، وفي الآخر راجعين لك.',
fs:'اعترافٌ بأن تقلّب العبد بين الصباح والمساء والحياة والموت إنما هو بالله وبحوله، وأن المرجع إليه يوم البعث.',
f:'من هدي النبي ﷺ الذي علّمه أصحابه صباحًا ومساءً.',s:'رواه أبو داود والترمذي، وصحّحه الألباني.'},
{t:'b',n:1,m:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
eg:'ده سيد الاستغفار. بتقول لربنا: انت ربي وأنا عبدك، ماشي على عهدك على قد ما أقدر، معترف بنعمتك عليّا ومعترف بذنبي، فاغفرلي لأن مفيش غيرك بيغفر.',
fs:'سيد الاستغفار، يجمع التوحيد والإقرار بالعبودية، والوفاء بالعهد قدر الاستطاعة، والاعتراف بالنعمة والذنب، ثم طلب المغفرة ممن لا يغفر الذنوب سواه.',
f:'من قالها من النهار موقنًا بها فمات من يومه قبل أن يُمسي فهو من أهل الجنة، ومن قالها من الليل موقنًا بها فمات قبل أن يُصبح فهو من أهل الجنة.',s:'رواه البخاري.'},
{t:'b',n:4,m:'اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ',e:'اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ',
eg:'بتشهّد ربنا، وتشهّد الملايكة اللي شايلين العرش وكل الملايكة وكل المخلوقات، إنك مؤمن إن مفيش إله غيره وإن سيدنا محمد عبده ورسوله.',
fs:'إشهادٌ لله وحملة عرشه وملائكته وجميع خلقه على توحيده وإفراده بالألوهية، وعلى الإقرار بعبودية محمد ﷺ ورسالته.',
f:'من قالها مرة أعتق الله ربعه من النار، ومن قالها مرتين أعتق الله نصفه، ومن قالها ثلاثًا أعتق الله ثلاثة أرباعه، ومن قالها أربعًا أعتقه الله من النار.',s:'رواه أبو داود، وحسّن إسناده ابن باز في تحفة الأخيار.'},
{t:'b',n:1,m:'اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ',e:'اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ',
eg:'بتعترف إن كل نعمة عندك أو عند أي حد في الدنيا هي من ربنا لوحده، فبتحمده وتشكره عليها.',
fs:'اعترافٌ بأن كل نعمة على العبد أو على أحدٍ من الخلق فهي من الله وحده، يتبعه حمده وشكره عليها.',
f:'من قالها حين يُصبح فقد أدّى شكر يومه، ومن قالها حين يُمسي فقد أدّى شكر ليلته.',s:'رواه أبو داود والنسائي في الكبرى، وحسّن إسناده ابن باز.'},
{t:'b',n:3,m:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ',
eg:'بتطلب من ربنا يعافيك في جسمك وسمعك ونظرك، وتستعيذ بيه من الكفر ومن الفقر ومن عذاب القبر.',
fs:'سؤالٌ لله العافية في البدن والسمع والبصر، واستعاذةٌ به من الكفر والفقر وعذاب القبر، مع تجديد كلمة التوحيد.',
f:'كان النبي ﷺ يدعو بهن ثلاثًا حين يُصبح وثلاثًا حين يُمسي، وكان أبو بكرة رضي الله عنه يحب أن يستنّ بسنّته.',s:'رواه أبو داود وأحمد، وحسّن إسناده ابن باز.'},
{t:'b',n:7,m:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',
eg:'ربنا كفايتي، مفيش إله غيره، متوكل عليه هو بس، وهو رب العرش العظيم. لما تقولها بيقين بتسلّم همومك كلها لربنا.',
fs:'إعلانٌ بأن الله كافي العبد، وإفرادٌ له بالألوهية، وتفويضٌ للأمر إليه وحده، وهو رب العرش العظيم.',
f:'من قالها حين يُصبح وحين يُمسي سبع مرات كفاه الله ما أهمّه من أمر الدنيا والآخرة.',s:'رواه ابن السني مرفوعًا، وأبو داود موقوفًا على أبي الدرداء رضي الله عنه، وصحّح إسناده الأرناؤوط.'},
{t:'b',n:1,m:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي',
eg:'بتطلب من ربنا يسامحك ويعافيك في دينك ودنيتك وبيتك وفلوسك، ويستر عيوبك، ويطمّن خوفك، ويحرسك من كل ناحية.',
fs:'دعاءٌ جامع بالعفو والعافية في الدين والدنيا والأهل والمال، وبستر العيوب وتأمين المخاوف، وبالحفظ من الجهات الست.',
f:'لم يكن النبي ﷺ يدع هؤلاء الدعوات حين يُمسي وحين يُصبح.',s:'رواه أبو داود وابن ماجه، وصحّحه الألباني.'},
{t:'b',n:1,m:'اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ',
eg:'بتستعيذ بربنا اللي عارف الظاهر والمستخبي من شر نفسك ومن الشيطان، ومن إنك تأذي نفسك أو تأذي أي مسلم.',
fs:'توسّلٌ إلى الله بعلمه وخلقه وربوبيته، واستعاذةٌ به من شر النفس والشيطان، ومن اقتراف السوء على النفس أو إيصاله إلى مسلم.',
f:'علّمه النبي ﷺ أبا بكر رضي الله عنه وأمره أن يقوله إذا أصبح وإذا أمسى وإذا أخذ مضجعه.',s:'رواه أبو داود والترمذي، وقال الترمذي: حسن صحيح.'},
{t:'b',n:3,m:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
eg:'بتتحصّن باسم ربنا، اللي لو اسمه معاك مفيش حاجة في الأرض ولا في السما تقدر تضرّك إلا بإذنه.',
fs:'تحصّنٌ باسم الله الذي لا يضر مع ذكره شيء في الأرض ولا في السماء، وهو السميع لأقوال العباد العليم بأحوالهم.',
f:'من قالها ثلاث مرات لم يُصبه فجأة بلاء حتى يُصبح، ومن قالها حين يُصبح ثلاثًا لم يصبه فجأة بلاء حتى يُمسي.',s:'رواه أبو داود والترمذي، وقال الترمذي: حسن صحيح.'},
{t:'b',n:3,m:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا',
eg:'بتجدّد رضاك: ربنا ربك، والإسلام دينك، وسيدنا محمد نبيك. رضا من القلب مش بس كلام.',
fs:'تجديدٌ للرضا القلبي بربوبية الله، وبالإسلام دينًا، وبمحمد ﷺ نبيًّا ورسولًا.',
f:'من قال: رضيت بالله ربًّا وبالإسلام دينًا وبمحمد رسولًا، وجبت له الجنة.',s:'أصل الذكر وفضله في صحيح مسلم، وتقييده بالصباح والمساء ثلاثًا عند أبي داود وفي إسناده كلام.'},
{t:'b',n:1,m:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ',
eg:'بتنادي ربنا: يا حي يا قيوم، أنا محتاجك، صلّح لي كل أموري، وماتسيبنيش لنفسي ولا لحظة.',
fs:'استغاثةٌ بالله باسميه الحي القيوم، وسؤاله إصلاح الشأن كله، وألا يكل العبد إلى نفسه ولو طرفة عين.',
f:'أوصى به النبي ﷺ ابنته فاطمة رضي الله عنها أن تقوله إذا أصبحت وإذا أمست.',s:'رواه النسائي في الكبرى والحاكم، وحسّنه الألباني.'},
{t:'b',n:1,m:'أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ',e:'أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ',
eg:'بتأكد إنك صاحي أو بايت على الإسلام والتوحيد، وعلى دين النبي ﷺ وطريق سيدنا إبراهيم.',
fs:'تجديدٌ للعهد على الفطرة وكلمة التوحيد، ودين النبي محمد ﷺ، وملة إبراهيم عليه السلام المائلة عن الشرك إلى التوحيد.',
f:'كان النبي ﷺ يقوله إذا أصبح وإذا أمسى.',s:'رواه أحمد، وصحّحه الألباني.'},
